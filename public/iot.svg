<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="currentColor">
  <!-- Central Microchip / Processor -->
  <rect x="70" y="70" width="60" height="60" rx="10" fill="none" stroke="currentColor" stroke-width="6"/>
  <rect x="82" y="82" width="36" height="36" rx="6" fill="currentColor"/>
  
  <!-- Microchip Inner Core Emblem -->
  <path d="M92 94 L100 86 L108 94 L108 106 L100 114 L92 106 Z" fill="#000000" stroke="#000000" stroke-width="2"/>
  <circle cx="100" cy="100" r="3" fill="currentColor"/>

  <!-- CPU Pin Connectors -->
  <!-- Top Pins -->
  <line x1="80" y1="56" x2="80" y2="70" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="93" y1="56" x2="93" y2="70" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="107" y1="56" x2="107" y2="70" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="120" y1="56" x2="120" y2="70" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <!-- Bottom Pins -->
  <line x1="80" y1="130" x2="80" y2="144" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="93" y1="130" x2="93" y2="144" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="107" y1="130" x2="107" y2="144" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="120" y1="130" x2="120" y2="144" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <!-- Left Pins -->
  <line x1="56" y1="80" x2="70" y2="80" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="56" y1="93" x2="70" y2="93" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="56" y1="107" x2="70" y2="107" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="56" y1="120" x2="70" y2="120" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <!-- Right Pins -->
  <line x1="130" y1="80" x2="144" y2="80" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="93" x2="144" y2="93" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="107" x2="144" y2="107" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <line x1="130" y1="120" x2="144" y2="120" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>

  <!-- Wireless Signal Waves (Top Right) -->
  <path d="M135 55 A 40 40 0 0 1 165 85" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <path d="M145 45 A 55 55 0 0 1 180 80" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
  <circle cx="128" cy="62" r="3.5" fill="currentColor"/>

  <!-- Orbiting IoT Nodes & Network Pathways -->
  <!-- Top Left Sensor Node -->
  <line x1="70" y1="70" x2="40" y2="40" stroke="currentColor" stroke-width="4" stroke-dasharray="3,3"/>
  <circle cx="36" cy="36" r="10" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="36" cy="36" r="4" fill="currentColor"/>

  <!-- Bottom Left Cloud / Device Node -->
  <line x1="70" y1="130" x2="38" y2="162" stroke="currentColor" stroke-width="4" stroke-dasharray="3,3"/>
  <path d="M26 166 A 6 6 0 0 1 35 158 A 9 9 0 0 1 51 161 A 6 6 0 0 1 50 172 L26 172 A 6 6 0 0 1 26 166 Z" fill="none" stroke="currentColor" stroke-width="3.5"/>

  <!-- Bottom Right Smart Gear Node -->
  <line x1="130" y1="130" x2="160" y2="160" stroke="currentColor" stroke-width="4" stroke-dasharray="3,3"/>
  <circle cx="164" cy="164" r="9" fill="none" stroke="currentColor" stroke-width="4"/>
  <circle cx="164" cy="164" r="3.5" fill="currentColor"/>
  <!-- Gear teeth ticks -->
  <line x1="164" y1="151" x2="164" y2="153" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="164" y1="175" x2="164" y2="177" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="151" y1="164" x2="153" y2="164" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <line x1="175" y1="164" x2="177" y2="164" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Center Network Ring Accent -->
  <circle cx="100" cy="24" r="6" fill="none" stroke="currentColor" stroke-width="3.5"/>
  <line x1="100" y1="30" x2="100" y2="56" stroke="currentColor" stroke-width="3.5"/>
